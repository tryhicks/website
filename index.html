<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ulana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      background: #F0ECD9;
      color: #2E333A;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Top nav (fixed) ── */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 5vw;
      z-index: 100;
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      color: #2E333A;
      flex-shrink: 0;
    }

    .nav-icon svg {
      width: 100%;
      height: 100%;
    }

    .btn-buy {
      padding: 8px 20px;
      border-radius: 999px;
      background: transparent;
      color: #2E333A;
      border: 1px solid #2E333A;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn-buy:hover {
      background: #2E333A;
      color: #F0ECD9;
    }

    /* ── Hero section ── */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .watermark {
      position: absolute;
      right: -5vw;
      top: 50%;
      transform: translateY(-50%);
      width: 85vw;
      max-width: 1200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.06;
      color: #2E333A;
    }

    .watermark svg {
      width: 100%;
      height: auto;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      padding: 12vh 5vw 0;
      display: flex;
      flex-direction: column;
    }

    .hero-inner {
      max-width: 900px;
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.2;
      color: #2E333A;
    }

    .sub-headline {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.2;
      color: #2E333A;
      margin-top: 2.6vh;
    }

    .cta-row {
      display: flex;
      gap: 1.2vw;
      margin-top: 5.3vh;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-primary {
      padding: 1.3vh 2.6vw;
      border-radius: 999px;
      background: #2E333A;
      color: #F0ECD9;
      border: none;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    .btn-primary:hover {
      opacity: 0.85;
    }

    .btn-secondary {
      padding: 1.3vh 2.6vw;
      border-radius: 999px;
      background: transparent;
      color: #2E333A;
      border: 1px solid #2E333A;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background: #2E333A;
      color: #F0ECD9;
    }

    .feature-list {
      font-size: 13px;
      color: #2E333A;
      opacity: 0.5;
      margin-top: 1.8vh;
    }

    .bottom-brand {
      position: absolute;
      bottom: 5vh;
      left: 5vw;
      z-index: 10;
    }

    .wordmark-text {
      font-size: clamp(60px, 15vw, 200px);
      font-weight: 900;
      color: #2E333A;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .tagline {
      font-size: 24px;
      font-weight: 700;
      color: #2E333A;
      margin-top: 4px;
    }

    /* ── Screenshot section ── */
    .screenshot-section {
      width: 100vw;
      min-height: 100vh;
      background: #2E333A;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8vh 5vw;
    }

    .screenshot-section img {
      width: 100%;
      max-width: 1200px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
  </style>
</head>

    <button class="btn-buy">Buy ulana</button>
  </nav>

    <div class="hero-content">
      <div class="hero-inner">
        <h1>The thinking you've done sits buried in notes you forget the moment life moves on.</h1>
        <p class="sub-headline">ulana reads your notes, finds the connections, and builds a private wiki you can query.</p>
        <div class="cta-row">
          <button class="btn-primary">View demo</button>
          <button class="btn-secondary">Buy ulana</button>
        </div>
        <p class="feature-list">Desktop app · local-first · no account · no telemetry · one-time payment</p>
      </div>
    </div>

    <div class="bottom-brand">
      <div class="wordmark-text">ulana</div>
      <p class="tagline">Woven by agents. Kept by you.</p>
    </div>
  </section>

  <!-- Screenshot section -->
  <section class="screenshot-section">
    <img src="assets/photo_2026-08-02_15-09-11.jpg" alt="Ulana app screenshot">
  </section>
</body>
</html>
